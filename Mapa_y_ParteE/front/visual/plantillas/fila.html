<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url('/app/static/fuentes/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url('/app/static/fuentes/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;src:url('/app/static/fuentes/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;src:url('/app/static/fuentes/barlow-latin-600-normal.woff2') format('woff2')}
html,body{margin:0;padding:0;background:transparent;font-family:Barlow,'Segoe UI',sans-serif;color:#262B33}
.caja{max-width:1000px;background:#fff;border:1px solid #D3D8D1;border-radius:14px;overflow:hidden}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px 10px 18px;border-bottom:1px solid #E0E3DD}
.reloj{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1;min-width:4.2ch;
  background:#262B33;color:#fff;border-radius:8px;padding:5px 10px;text-align:center}
.datos{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;flex:1 1 auto}
.datos b{font-family:'Barlow Condensed';font-size:19px}
.rojo{color:#C0241B}
.controles{display:flex;gap:8px;align-items:center}
button{font:600 14px Barlow,sans-serif;color:#262B33;background:#fff;border:1.5px solid #D3D8D1;border-radius:8px;
  padding:5px 12px;cursor:pointer;box-shadow:0 3px 0 #C9CEC7;transition:transform .1s,box-shadow .1s,border-color .15s}
button:hover{border-color:#262B33}
button:active{transform:translateY(3px);box-shadow:none}
button[aria-pressed="true"]{background:#262B33;color:#fff;border-color:#262B33;box-shadow:0 3px 0 #11151A}
button:focus-visible,input:focus-visible{outline:3px solid #1F6FB2;outline-offset:2px}
svg{display:block;width:100%;height:auto}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 18px 12px;font-size:14px;color:#5E6670;
  border-top:1px solid #E0E3DD}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;
  vertical-align:-1px;background:var(--c)}
.linea{padding:10px 18px 4px}
.linea h3{margin:0 0 4px;font-family:'Barlow Condensed';font-weight:700;font-size:19px}
input[type=range]{width:100%;accent-color:#D42A20;margin:6px 0 10px}
.persona{transition:transform var(--t,400ms) cubic-bezier(.4,0,.2,1),opacity var(--t,400ms) ease}
.persona .cuerpo{transition:fill .35s ease}
.letra{font-family:'Barlow Condensed';font-weight:700}
</style>
</head>
<body>
<div class="caja">
  <div class="barra">
    <div class="reloj" id="reloj" aria-label="Hora de la simulación">00:00</div>
    <div class="datos" aria-live="polite">
      <span id="bus">Bus</span>
      <span>Subieron: <b id="suben">0</b></span>
      <span>En la fila: <b id="cola">0</b></span>
      <span class="rojo">Se quedaron sin cupo: <b id="quedan">0</b></span>
    </div>
    <div class="controles">
      <button type="button" id="pausa">Pausar</button>
      <button type="button" data-vel="1" aria-pressed="true">x1</button>
      <button type="button" data-vel="4" aria-pressed="false">x4</button>
      <button type="button" data-vel="12" aria-pressed="false">x12</button>
    </div>
  </div>
  <svg id="anden" viewBox="0 34 1000 284" role="img" aria-label="Andén con la fila de personas y los buses que llegan"></svg>
  <div class="leyenda">
    <span style="--c:#262B33">Llegó y está esperando</span>
    <span style="--c:#D42A20">Ya se le fue al menos un bus por falta de cupo</span>
    <span style="--c:#9AA6B2" id="escala"></span>
  </div>
  <div class="linea">
    <h3>Gente que se queda en la fila después de cada bus</h3>
    <svg id="grafica" viewBox="0 0 1000 170" role="img"></svg>
    <input type="range" id="barra" min="0" value="0" aria-label="Ir a un bus de la simulación">
  </div>
</div>
<script>
const D = __DATOS__;
const NS = "http://www.w3.org/2000/svg";
const ROJO = "#D42A20", GRAFITO = "#262B33";
const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, attrs, padre) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
}
function reloj(seg) {
  const h = Math.floor(seg / 3600), m = Math.floor(seg % 3600 / 60), s = seg % 60;
  const dos = v => String(v).padStart(2, "0");
  return h > 0 ? `${h}:${dos(m)}:${dos(s)}` : `${dos(m)}:${dos(s)}`;
}
function miles(v) { return v.toLocaleString("es-CO"); }

// ---------------------------------------------------------------- escenario
const svg = document.getElementById("anden");
const fondo = el("g", {}, svg);
el("rect", { x: 0, y: 0, width: 1000, height: 318, fill: "#F4F5F2" }, fondo);
el("rect", { x: 0, y: 44, width: 1000, height: 14, fill: GRAFITO }, fondo);
el("rect", { x: 0, y: 56, width: 1000, height: 3, fill: ROJO }, fondo);
el("rect", { x: 0, y: 59, width: 1000, height: 128, fill: "#DCE6EE" }, fondo);
for (let x = 0; x <= 1000; x += 62) el("path", { d: `M ${x} 59 V 187`, stroke: "#fff", "stroke-width": 4 }, fondo);
el("rect", { x: 772, y: 72, width: 56, height: 115, fill: "#C6D3DD" }, fondo);
const puertaA = el("rect", { x: 772, y: 72, width: 28, height: 115, fill: "#F2F6F8", stroke: "#9AA6B2" }, fondo);
const puertaB = el("rect", { x: 800, y: 72, width: 28, height: 115, fill: "#F2F6F8", stroke: "#9AA6B2" }, fondo);
[puertaA, puertaB].forEach(p => p.style.transition = "transform 250ms ease");
el("rect", { x: 0, y: 187, width: 1000, height: 44, fill: "#B9BFB8" }, fondo);
el("rect", { x: 0, y: 227, width: 1000, height: 5, fill: "#F0A202" }, fondo);
el("rect", { x: 0, y: 232, width: 1000, height: 86, fill: "#D3D8D1" }, fondo);
el("path", { d: "M 0 300 H 1000", stroke: "#fff", "stroke-width": 3, "stroke-dasharray": "26 18" }, fondo);

const capaGente = el("g", {}, svg);
const capaBus = el("g", {}, svg);
const bus = el("g", {}, capaBus);
const cuerpoBus = el("g", { transform: "scale(.98)" }, bus);
cuerpoBus.innerHTML = `__BUS__`;
const PUERTA_X = 800, BUS_PARADO = PUERTA_X - .98 * 162, BUS_Y = 236;
bus.style.transition = "transform 400ms cubic-bezier(.3,.7,.3,1)";
bus.style.transform = `translate(-260px, ${BUS_Y}px)`;

// ---------------------------------------------------------------- personas
// Cada figura representa D.escala personas. La fila arranca en la puerta y crece a la izquierda.
const POR_COLUMNA = 2, PASO = 18;
const MAX_FIGURAS = D.max_figuras;
function lugar(j) {
  const fila = j % POR_COLUMNA, col = Math.floor(j / POR_COLUMNA);
  return [768 - col * PASO - fila * 8, fila === 0 ? 225 : 205];
}
function nuevaFigura() {
  const g = el("g", { class: "persona" }, capaGente);
  const c = el("g", { class: "cuerpo", fill: GRAFITO, transform: "scale(1.22)" }, g);
  el("circle", { cx: 0, cy: -27, r: 4.6 }, c);
  el("rect", { x: -4.8, y: -21, width: 9.6, height: 13, rx: 4.5 }, c);
  el("rect", { x: -4, y: -9.5, width: 3.2, height: 9.5, rx: 1.6 }, c);
  el("rect", { x: .8, y: -9.5, width: 3.2, height: 9.5, rx: 1.6 }, c);
  return { g: g, c: c };
}
let fila = [];   // figuras en orden: la primera esta junto a la puerta
function ponerEn(fig, x, y, op) {
  fig.g.style.transform = `translate(${x}px, ${y}px)`;
  fig.g.style.opacity = op;
}
function colorear(fig, color) { fig.c.setAttribute("fill", color); }
function acomodar() { fila.forEach((f, j) => { const [x, y] = lugar(j); ponerEn(f, x, y, 1); }); }
function figuras(personas) { return Math.min(MAX_FIGURAS, Math.round(personas / D.escala)); }

// ---------------------------------------------------------------- grafica
const graf = document.getElementById("grafica");
const B = D.buses.length;
const T0 = 0, T1 = Math.max(1, D.buses[B - 1][0]);
let maxCola = 1;
D.buses.forEach(b => { if (b[3] > maxCola) maxCola = b[3]; });
const GX = v => 54 + (v - T0) / (T1 - T0) * 930, GY = v => 140 - v / maxCola * 120;
el("path", { d: "M 54 140 H 984", stroke: "#C9CEC7", "stroke-width": 2 }, graf);
el("path", { d: "M 54 20 H 984", stroke: "#EEF0EC", "stroke-width": 1.5 }, graf);
let area = `M ${GX(0)} 140`;
D.buses.forEach(b => { area += ` L ${GX(b[0])} ${GY(b[3])}`; });
area += ` L ${GX(T1)} 140 Z`;
el("path", { d: area, fill: ROJO, "fill-opacity": .18 }, graf);
let linea = `M ${GX(0)} 140`;
D.buses.forEach(b => { linea += ` L ${GX(b[0])} ${GY(b[3])}`; });
el("path", { d: linea, fill: "none", stroke: ROJO, "stroke-width": 2.5, "stroke-linejoin": "round" }, graf);
function etiqueta(x, y, texto, ancla) {
  const t = el("text", { x: x, y: y, "text-anchor": ancla || "middle", fill: "#5E6670", "font-size": 13,
                         "font-family": "Barlow" }, graf);
  t.textContent = texto;
}
etiqueta(48, 24, miles(maxCola), "end");
etiqueta(48, 144, "0", "end");
etiqueta(GX(0), 162, reloj(0), "start");
etiqueta(GX(T1 / 2), 162, reloj(Math.round(T1 / 2)));
etiqueta(GX(T1), 162, reloj(T1), "end");
if (maxCola <= 1 && D.buses.every(b => b[3] === 0)) {
  etiqueta(519, 90, "Nadie se quedó sin cupo: todos subieron al primer bus que pasó.");
}
const cursor = el("path", { d: "M 54 14 V 140", stroke: GRAFITO, "stroke-width": 2, "stroke-dasharray": "4 4" }, graf);
graf.setAttribute("aria-label", `Gráfica: máximo ${maxCola} personas quedándose en la fila`);

// ---------------------------------------------------------------- animacion
const barra = document.getElementById("barra");
barra.max = B - 1;
let k = 0, velocidad = 1, pausado = false, temporizador = null;
const BASE = Math.min(1500, Math.max(420, 26000 / B));
function duracion() { return BASE / velocidad; }

function pintarDatos(i, fase) {
  const b = D.buses[i];
  document.getElementById("reloj").textContent = reloj(b[0]);
  const nombre = D.grupo > 1
    ? `Buses <b>${miles(i * D.grupo + 1)}–${miles(Math.min(D.total_buses, (i + 1) * D.grupo))}</b> de ${miles(D.total_buses)}`
    : `Bus <b>${miles(i + 1)}</b> de ${miles(D.total_buses)}`;
  document.getElementById("bus").innerHTML = nombre;
  document.getElementById("suben").textContent = fase === 0 ? "0" : miles(b[2]);
  document.getElementById("cola").textContent = miles(fase === 0 ? b[3] + b[2] : b[3]);
  document.getElementById("quedan").textContent = fase === 2 ? miles(b[3]) : (i > 0 ? miles(D.buses[i - 1][3]) : "0");
  cursor.setAttribute("d", `M ${GX(b[0])} 14 V 140`);
  barra.value = i;
}
function estadoInicial(i) {
  // Antes del bus i: en la fila estan los que se quedaron del bus anterior (en rojo).
  capaGente.innerHTML = "";
  fila = [];
  const previos = i > 0 ? figuras(D.buses[i - 1][3]) : 0;
  for (let j = 0; j < previos; j++) {
    const f = nuevaFigura();
    colorear(f, ROJO);
    fila.push(f);
  }
  document.body.style.setProperty("--t", "0ms");
  acomodar();
}
function paso(i) {
  return new Promise(listo => {
    const t = duracion();
    document.body.style.setProperty("--t", `${Math.round(t * .28)}ms`);
    bus.style.transition = `transform ${Math.round(t * .28)}ms cubic-bezier(.3,.7,.3,1)`;
    const b = D.buses[i];
    pintarDatos(i, 0);
    // 1. llega gente nueva (entra caminando por la izquierda)
    const antes = figuras(b[3] + b[2]);
    const nuevas = Math.max(0, antes - fila.length);
    for (let j = 0; j < nuevas; j++) {
      const f = nuevaFigura();
      const [x, y] = lugar(fila.length);
      ponerEn(f, x - 60, y, 0);
      fila.push(f);
    }
    requestAnimationFrame(() => requestAnimationFrame(acomodar));
    // 2. llega el bus
    bus.style.transform = `translate(-260px, ${BUS_Y}px)`;
    temporizador = setTimeout(() => {
      bus.style.transform = `translate(${BUS_PARADO}px, ${BUS_Y}px)`;
      temporizador = setTimeout(() => {
        // 3. abren puertas y suben hasta la capacidad
        puertaA.style.transform = "translateX(-24px)";
        puertaB.style.transform = "translateX(24px)";
        const despues = figuras(b[3]);
        const suben = Math.max(0, fila.length - despues);
        const fuera = fila.splice(0, suben);
        fuera.forEach((f, j) => {
          f.g.style.transitionDelay = `${Math.round(j * Math.min(14, t * .25 / Math.max(1, suben)))}ms`;
          ponerEn(f, PUERTA_X, 262, 0);
        });
        acomodar();
        pintarDatos(i, 1);
        temporizador = setTimeout(() => {
          fuera.forEach(f => f.g.remove());
          puertaA.style.transform = "";
          puertaB.style.transform = "";
          // 4. el bus se va; los que quedaron se ponen en rojo
          bus.style.transform = `translate(1060px, ${BUS_Y}px)`;
          fila.forEach(f => colorear(f, ROJO));
          pintarDatos(i, 2);
          temporizador = setTimeout(() => listo(), t * .22);
        }, t * .3);
      }, t * .2);
    }, 30);
  });
}
let generacion = 0;   // cada vez que se vuelve a arrancar, la corrida anterior se detiene
async function correr() {
  const mia = ++generacion;
  while (!pausado && k < B && mia === generacion) {
    await paso(k);
    if (pausado || mia !== generacion) return;
    k++;
  }
  if (mia !== generacion) return;
  if (k >= B) {
    document.getElementById("pausa").textContent = "Repetir";
    k = B;
  }
}
const botonPausa = document.getElementById("pausa");
botonPausa.addEventListener("click", () => {
  if (k >= B) { k = 0; estadoInicial(0); pausado = false; botonPausa.textContent = "Pausar"; correr(); return; }
  pausado = !pausado;
  botonPausa.textContent = pausado ? "Seguir" : "Pausar";
  if (!pausado) { clearTimeout(temporizador); estadoInicial(k); correr(); }
});
document.querySelectorAll("[data-vel]").forEach(b => b.addEventListener("click", () => {
  velocidad = Number(b.dataset.vel);
  document.querySelectorAll("[data-vel]").forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false"));
}));
barra.addEventListener("input", () => {
  clearTimeout(temporizador);
  k = Number(barra.value);
  estadoInicial(k);
  pintarDatos(k, 0);
  if (!pausado) correr();
});
document.getElementById("escala").textContent =
  D.escala > 1 ? `Cada figura representa ${miles(D.escala)} personas` : "Cada figura es una persona";

if (sinMovimiento) {
  pausado = true; botonPausa.textContent = "Seguir";
  k = B - 1; estadoInicial(k); pintarDatos(k, 2);
} else {
  estadoInicial(0);
  document.fonts.ready.then(() => setTimeout(correr, 250));
}
</script>
</body>
</html>
