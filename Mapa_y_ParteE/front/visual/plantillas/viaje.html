<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url('/app/static/fuentes/barlow-condensed-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url('/app/static/fuentes/barlow-condensed-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;src:url('/app/static/fuentes/barlow-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;src:url('/app/static/fuentes/barlow-latin-600-normal.woff2') format('woff2')}
html,body{margin:0;padding:0;background:transparent;font-family:Barlow,'Segoe UI',sans-serif;color:#262B33}
.mapa{background:#fff;border:1px solid #D3D8D1;border-radius:14px;overflow:hidden}
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 10px 18px;
  border-bottom:1px solid #E0E3DD}
.estado{font-weight:500;font-size:16px;min-height:1.5em;line-height:1.5}
.estado b{font-family:'Barlow Condensed';font-weight:700;font-size:18px}
button{font:600 15px Barlow,sans-serif;color:#262B33;background:#fff;border:1.5px solid #D3D8D1;border-radius:8px;
  padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 #C9CEC7;transition:transform .1s,box-shadow .1s,border-color .15s;
  white-space:nowrap}
button:hover{border-color:#262B33}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid #1F6FB2;outline-offset:2px}
svg{display:block;width:100%;height:auto}
.nombre{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;fill:#5E6670;transition:fill .2s}
.nombre.visitada{fill:#262B33}
.nombre.actual{fill:#262B33;font-weight:700}
.parada{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.globo text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px}
.insignia text{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="mapa">
  <div class="barra">
    <div class="estado" id="estado" aria-live="polite"></div>
    <button id="otra" type="button">Ver el recorrido otra vez</button>
  </div>
  <svg id="lienzo" role="img"></svg>
</div>
<script>
const DATOS = __DATOS__;
const NS = "http://www.w3.org/2000/svg";
const GRAFITO = "#262B33";
const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, attrs, padre) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
}
function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }
function suave(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

// ---------------------------------------------------------------- paradas
// Todas las paradas del viaje en orden. La estacion de transbordo aparece una vez.
const paradas = [];
DATOS.tramos.forEach((tramo, ti) => {
  tramo.paradas.forEach((nombre, i) => {
    if (ti > 0 && i === 0) { paradas[paradas.length - 1].transbordo = ti; return; }
    paradas.push({ nombre: nombre, tramo: ti });
  });
});
const N = paradas.length;

// ---------------------------------------------------------------- trazado
// Plano de W unidades de ancho; las paradas van en filas que se devuelven
// (como una serpiente), asi un viaje largo cabe sin hacerse diminuto.
// En pantallas angostas el plano es mas estrecho (menos paradas por fila,
// letras mas grandes en proporcion).
const ancho = document.body.clientWidth || 1000;
const W = ancho < 560 ? 460 : (ancho < 820 ? 720 : 1000);
const K = ancho < 560 ? 3 : (ancho < 820 ? 5 : DATOS.por_fila);
const MARGEN = ancho < 560 ? 78 : 96, FILA = 136, ARRIBA = 64, RADIO = FILA / 2;
const filas = Math.ceil(N / K);
let paso = (W - 2 * MARGEN) / (K - 1);
let corrimiento = 0;
if (N <= K) {
  paso = Math.min(paso, N > 1 ? (W - 2 * MARGEN) / (N - 1) : 0, 230);
  corrimiento = (W - 2 * MARGEN - paso * (N - 1)) / 2;
}
for (let i = 0; i < N; i++) {
  const fila = Math.floor(i / K);
  let col = i % K;
  if (fila % 2 === 1) col = K - 1 - col;
  paradas[i].x = MARGEN + corrimiento + col * paso;
  paradas[i].y = ARRIBA + fila * FILA;
  paradas[i].borde = filas > 1 && (col === 0 || col === K - 1) ? (col === 0 ? "izq" : "der") : "";
}
const H = ARRIBA + (filas - 1) * FILA + 86;

const svg = document.getElementById("lienzo");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("aria-label", DATOS.resumen);

// ---------------------------------------------------------------- plano de fondo
const fondo = el("g", {}, svg);
el("rect", { x: 0, y: 0, width: W, height: H, fill: "#F4F5F2" }, fondo);
el("path", { d: `M ${W * .62} ${-20} C ${W * .55} ${H * .35}, ${W * .78} ${H * .6}, ${W * .7} ${H + 20}`,
             fill: "none", stroke: "#DCE8F0", "stroke-width": 16, "stroke-linecap": "round" }, fondo);
el("rect", { x: W * .08, y: H * .52, width: 120, height: 70, rx: 18, fill: "#E2EDDD" }, fondo);
for (let x = 40; x < W; x += 60) el("path", { d: `M ${x} 0 V ${H}`, stroke: "#E8EAE5", "stroke-width": 2 }, fondo);
for (let y = 30; y < H; y += 60) el("path", { d: `M 0 ${y} H ${W}`, stroke: "#E8EAE5", "stroke-width": 2 }, fondo);
for (let x = 220; x < W; x += 360) el("path", { d: `M ${x} 0 V ${H}`, stroke: "#E2E5DF", "stroke-width": 7 }, fondo);
el("path", { d: `M -20 ${H * .9} L ${W + 20} ${H * .15}`, stroke: "#E2E5DF", "stroke-width": 9 }, fondo);

// ---------------------------------------------------------------- tramos entre paradas
const vias = el("g", {}, svg);
const pintado = el("g", {}, svg);
const segmentos = [];
for (let s = 0; s < N - 1; s++) {
  const a = paradas[s], b = paradas[s + 1];
  let d;
  if (Math.abs(a.y - b.y) < 1) d = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
  else d = `M ${a.x} ${a.y} A ${RADIO} ${RADIO} 0 0 ${a.borde === "der" ? 1 : 0} ${b.x} ${b.y}`;
  const color = DATOS.tramos[b.tramo].color;
  el("path", { d: d, fill: "none", stroke: "#D3D8D1", "stroke-width": 12, "stroke-linecap": "round" }, vias);
  const p = el("path", { d: d, fill: "none", stroke: color, "stroke-width": 12, "stroke-linecap": "round" }, pintado);
  const largo = p.getTotalLength();
  p.style.strokeDasharray = largo + 1;
  p.style.strokeDashoffset = largo + 1;
  segmentos.push({ p: p, largo: largo });
}

// ---------------------------------------------------------------- paradas y nombres
const capaParadas = el("g", {}, svg);
function partir(nombre) {
  if (nombre.length <= 16) return [nombre];
  const palabras = nombre.split(" ");
  let mejor = [nombre], peor = 1e9;
  for (let i = 1; i < palabras.length; i++) {
    const a = palabras.slice(0, i).join(" "), b = palabras.slice(i).join(" ");
    const m = Math.max(a.length, b.length);
    if (m < peor) { peor = m; mejor = [a, b]; }
  }
  return mejor;
}
paradas.forEach((p, i) => {
  const g = el("g", { class: "parada", style: `transform-origin:${p.x}px ${p.y}px` }, capaParadas);
  const extremo = i === 0 || i === N - 1;
  if (p.transbordo) {
    el("circle", { cx: p.x, cy: p.y, r: 16, fill: "#fff", stroke: GRAFITO, "stroke-width": 5 }, g);
    el("path", { d: `M ${p.x - 7} ${p.y} A 7 7 0 0 1 ${p.x + 7} ${p.y}`, fill: DATOS.tramos[p.transbordo - 1].color }, g);
    el("path", { d: `M ${p.x + 7} ${p.y} A 7 7 0 0 1 ${p.x - 7} ${p.y}`, fill: DATOS.tramos[p.transbordo].color }, g);
  } else {
    el("circle", { cx: p.x, cy: p.y, r: extremo ? 14 : 9, fill: "#fff", stroke: GRAFITO,
                   "stroke-width": extremo ? 6 : 4 }, g);
  }
  p.nodo = g;
  const lineas = partir(p.nombre);
  let x = p.x, anclaje = "middle";
  if (p.borde === "der") { anclaje = "end"; x = p.x + 14; }
  if (p.borde === "izq") { anclaje = "start"; x = p.x - 14; }
  const t = el("text", { x: x, y: p.y + 36, "text-anchor": anclaje, class: "nombre" }, capaParadas);
  lineas.forEach((linea, k) => {
    const ts = el("tspan", { x: x, dy: k === 0 ? 0 : 17 }, t);
    ts.textContent = linea;
  });
  p.texto = t;
});

// ---------------------------------------------------------------- el bus
const BUS = `__BUS__`;
const capaBus = el("g", { opacity: 0 }, svg);
const bus = el("g", {}, capaBus);
const cuerpo = el("g", { transform: "translate(-46 -31) scale(.42)" }, bus);
cuerpo.innerHTML = BUS;
const insignia = el("g", { class: "insignia" }, capaBus);
const fondoInsignia = el("rect", { x: -26, y: -62, width: 52, height: 21, rx: 5 }, insignia);
const textoInsignia = el("text", { x: 0, y: -46.5, "text-anchor": "middle" }, insignia);

function ponerRuta(ti) {
  fondoInsignia.setAttribute("fill", DATOS.tramos[ti].color);
  textoInsignia.setAttribute("fill", DATOS.tramos[ti].texto);
  textoInsignia.textContent = DATOS.tramos[ti].ruta;
  const anchoTexto = Math.max(44, DATOS.tramos[ti].ruta.length * 9 + 14);
  fondoInsignia.setAttribute("x", -anchoTexto / 2);
  fondoInsignia.setAttribute("width", anchoTexto);
}
function ubicarBus(x, y, angulo, haciaIzquierda) {
  bus.setAttribute("transform", haciaIzquierda
    ? `translate(${x} ${y}) rotate(${angulo - 180}) scale(-1 1)`
    : `translate(${x} ${y}) rotate(${angulo})`);
  insignia.setAttribute("transform", `translate(${x} ${y})`);
}

// ---------------------------------------------------------------- globos
const capaGlobos = el("g", {}, svg);
function globo(x, y, texto, color) {
  const g = el("g", { class: "globo", opacity: 0 }, capaGlobos);
  const t = el("text", { x: 0, y: 0, "text-anchor": "middle", fill: "#fff" }, g);
  t.textContent = texto;
  const w = t.getComputedTextLength() + 26;
  const r = el("rect", { x: -w / 2, y: -21, width: w, height: 30, rx: 8, fill: color }, g);
  g.insertBefore(r, t);
  el("path", { d: "M -7 8 L 0 16 L 7 8 Z", fill: color }, g);
  const xx = Math.min(Math.max(x, w / 2 + 8), W - w / 2 - 8);
  g.setAttribute("transform", `translate(${xx} ${y - 46})`);
  g.animate([{ opacity: 0, transform: `translate(${xx}px, ${y - 36}px)` },
             { opacity: 1, transform: `translate(${xx}px, ${y - 46}px)` }],
            { duration: 260, easing: "ease-out", fill: "forwards" });
  return g;
}

// ---------------------------------------------------------------- animacion
const estado = document.getElementById("estado");
let turno = 0;
const totalSeg = Math.max(1, N - 1);
const tSeg = Math.min(900, Math.max(260, 7000 / totalSeg));
const tPausa = tSeg * 0.32;

function decir(html) { estado.innerHTML = html; }
function marcar(i) {
  paradas.forEach((p, k) => {
    p.texto.classList.toggle("actual", k === i);
    p.texto.classList.toggle("visitada", k < i);
  });
  const nodo = paradas[i].nodo;
  nodo.animate([{ transform: "scale(1)" }, { transform: "scale(1.35)" }, { transform: "scale(1)" }],
               { duration: 380, easing: "ease-out" });
}
function reiniciar() {
  segmentos.forEach(s => { s.p.style.strokeDashoffset = s.largo + 1; });
  capaGlobos.innerHTML = "";
  insignia.getAnimations().forEach(a => a.cancel());
  paradas.forEach(p => p.texto.classList.remove("actual", "visitada"));
  capaBus.setAttribute("opacity", 0);
}
function mover(s, ms, miTurno) {
  const seg = segmentos[s];
  return new Promise(listo => {
    const inicio = performance.now();
    function cuadro(ahora) {
      if (miTurno !== turno) return listo(false);
      const t = Math.min(1, (ahora - inicio) / ms);
      const avance = suave(t) * seg.largo;
      const p = seg.p.getPointAtLength(avance);
      const q = seg.p.getPointAtLength(Math.min(seg.largo, avance + 1.5));
      const r = seg.p.getPointAtLength(Math.max(0, avance - 1.5));
      const dx = q.x - r.x, dy = q.y - r.y;
      const angulo = Math.atan2(dy, dx) * 180 / Math.PI;
      ubicarBus(p.x, p.y, Math.abs(dx) < 0.05 && Math.abs(dy) < 0.05 ? 0 : angulo, dx < -0.01);
      seg.p.style.strokeDashoffset = seg.largo + 1 - avance;
      if (t < 1) requestAnimationFrame(cuadro); else listo(true);
    }
    requestAnimationFrame(cuadro);
  });
}
function textoFinal() {
  const total = N - 1;
  const n = DATOS.tramos.length;
  return `Llegaste a <b>${paradas[N - 1].nombre}</b>: ${total} ${total === 1 ? "parada" : "paradas"}` +
         (n > 1 ? `, un transbordo en <b>${paradas.find(p => p.transbordo).nombre}</b>.` : ", sin transbordos.");
}
function dibujarFinal() {
  segmentos.forEach(s => { s.p.style.strokeDashoffset = 0; });
  const a = paradas[N - 1];
  capaBus.setAttribute("opacity", 1);
  ponerRuta(DATOS.tramos.length - 1);
  ubicarBus(a.x, a.y, 0, false);
  paradas.forEach(p => p.texto.classList.add("visitada"));
  decir(textoFinal());
}
async function jugar() {
  const miTurno = ++turno;
  reiniciar();
  const a = paradas[0];
  ponerRuta(0);
  ubicarBus(a.x, a.y, 0, N > 1 && paradas[1].x < a.x);
  decir(`Subes en <b>${a.nombre}</b> a la ruta <b>${DATOS.tramos[0].ruta}</b>`);
  marcar(0);
  capaBus.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
  capaBus.setAttribute("opacity", 1);
  await esperar(650);
  for (let s = 0; s < N - 1; s++) {
    if (miTurno !== turno) return;
    if (paradas[s].transbordo) {
      const t = paradas[s];
      const nueva = DATOS.tramos[t.transbordo];
      decir(`Transbordo en <b>${t.nombre}</b>: cambias a la ruta <b>${nueva.ruta}</b>`);
      const g = globo(t.x, t.y, `Cambia a ${nueva.ruta}`, GRAFITO);
      capaBus.animate([{ opacity: 1 }, { opacity: .15 }, { opacity: 1 }], { duration: 900 });
      await esperar(450);
      ponerRuta(t.transbordo);
      await esperar(650);
      if (miTurno !== turno) return;
      g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" });
    }
    const ok = await mover(s, tSeg, miTurno);
    if (!ok) return;
    const llega = paradas[s + 1];
    marcar(s + 1);
    if (s + 1 < N - 1) decir(`Parada ${s + 1} de ${N - 1}: <b>${llega.nombre}</b>`);
    await esperar(tPausa);
  }
  if (miTurno !== turno) return;
  const fin = paradas[N - 1];
  insignia.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
  globo(fin.x, fin.y - 8, "Llegaste", "#12A26A");
  decir(textoFinal());
}

document.getElementById("otra").addEventListener("click", () => { sinMovimiento ? dibujarFinal() : jugar(); });
if (sinMovimiento) dibujarFinal(); else document.fonts.ready.then(() => setTimeout(jugar, 150));
</script>
</body>
</html>
